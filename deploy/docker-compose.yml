# Production: docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
name: tillmate
x-app: &app
  image: tillmate-app
  pull_policy: never
  restart: unless-stopped
  env_file: ../.env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://retail_api:${API_DB_PASSWORD}@db/retail
    WORKER_DATABASE_URL: postgres://retail_worker:${WORKER_DB_PASSWORD}@db/retail
    FILE_STORE_DIR: /data/files
    CORS_ORIGINS: https://till.${DOMAIN}
    TRUST_PROXY: "1"
  volumes: [files:/data/files]

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    pull_policy: build
    restart: "no"
    depends_on: { db: { condition: service_healthy } }
    command: >
      sh -c "ADMIN_URL=postgres://postgres:${PG_PASSWORD}@db/postgres DB_NAME=retail
             API_PASSWORD=${API_DB_PASSWORD} WORKER_PASSWORD=${WORKER_DB_PASSWORD} ./db/setup-dev.sh"

  api:
    <<: *app
    depends_on: { migrate: { condition: service_completed_successfully } }
    working_dir: /app/apps/api
    command: npx tsx src/server.ts

  worker:
    <<: *app
    depends_on: { migrate: { condition: service_completed_successfully } }
    working_dir: /app/apps/api
    command: npx tsx src/worker/main.ts

  web:
    <<: *app
    depends_on: [api]
    working_dir: /app/apps/web
    environment:
      NODE_ENV: production
      API_URL: http://api:3000
    command: npx next start -p 3001

  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: proxy
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on: [web, api]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes: [caddy_data:/data, caddy_config:/config]

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
